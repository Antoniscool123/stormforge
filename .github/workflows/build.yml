name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        id: build
        run: gradle build --no-daemon --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Summarize errors
        if: failure()
        run: |
          {
            grep -n -E "error:|What went wrong|Could not|FAILED|not found|cannot find symbol" -A4 build.log | head -n 200
          } > summary.txt || true
          msg=$(python3 -c "print(open('summary.txt').read()[:30000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=Gradle build failed::$msg"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stormforge-jar
          path: build/libs/*.jar

      # Boots a real dedicated server with the mod and fails on any registry, recipe, loot or
      # worldgen data error. The server is stopped as soon as it reports "Done".
      - name: Server smoke test
        id: smoke
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          gradle runServer --no-daemon --console=plain > smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            grep -q -E 'Done \(|Failed to load datapacks|Registry loading errors|Crash report' smoke.log && break
            kill -0 $pid 2>/dev/null || break
            sleep 5
          done
          sleep 3
          pkill -f net.fabricmc.loader.impl.launch.knot || true
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          grep -q 'Done (' smoke.log || { echo "server never finished loading" >> smoke.log; exit 1; }
          if grep -q -E 'Registry loading errors|Failed to load datapacks|Parsing error|Couldn.t parse|Crash report' smoke.log; then
            echo "data errors found" >> smoke.log; exit 1
          fi

      - name: Report smoke test
        if: always()
        run: |
          [ -f smoke.log ] || exit 0
          {
            tail -n 5 smoke.log
            echo "----- relevant lines -----"
            grep -n -i -E "stormforge|ERROR|Exception|Couldn't|Failed|Done \(|autotest|Caused by" smoke.log | head -n 150
          } > smoke-summary.txt
          msg=$(python3 -c "print(open('smoke-summary.txt').read()[:30000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::notice title=Smoke test (${{ steps.smoke.outcome }})::$msg"

