name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        id: build
        run: gradle build --no-daemon --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Summarize errors
        if: failure()
        run: |
          {
            grep -n -E "error:|What went wrong|Could not|FAILED|not found|cannot find symbol" -A4 build.log | head -n 200
          } > summary.txt || true
          msg=$(python3 -c "print(open('summary.txt').read()[:30000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=Gradle build failed::$msg"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stormforge-jar
          path: build/libs/*.jar

      # Boots a real dedicated server with the mod. fabric.autoTest makes it exit once it has
      # finished loading, so registry, recipe, loot and worldgen JSON errors show up in the log.
      - name: Server smoke test
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          JAVA_TOOL_OPTIONS="-Dfabric.autoTest=true" timeout 540 gradle runServer --no-daemon --console=plain > smoke.log 2>&1
          code=$?
          echo "exit code: $code" >> smoke.log
          exit $code

      - name: Report smoke test
        if: always()
        run: |
          [ -f smoke.log ] || exit 0
          {
            tail -n 5 smoke.log
            echo "----- relevant lines -----"
            grep -n -i -E "stormforge|ERROR|Exception|Couldn't|Failed|Done \(|autotest|Caused by" smoke.log | head -n 150
          } > smoke-summary.txt
          msg=$(python3 -c "print(open('smoke-summary.txt').read()[:30000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::notice title=Smoke test (${{ steps.smoke.outcome }})::$msg"

      - name: Vanilla reference (temporary)
        if: always()
        run: |
          MCJ=~/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          mkdir -p v && cd v && unzip -q -o $MCJ 'data/minecraft/worldgen/feature/ore_gold_buried.json' 'data/minecraft/worldgen/feature/ore_diamond_small.json' 'data/minecraft/loot_table/blocks/lapis_ore.json' 'data/minecraft/worldgen/feature/ore_coal.json'; cd ..
          for f in $(find v -type f -name "*.json" | sort); do echo "### $f"; tr -d ' \n' < $f; echo; done > vref.txt
          msg=$(python3 -c "print(open('vref.txt').read()[:20000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::notice title=VREF::$msg"
