name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        id: build
        run: gradle build --no-daemon --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Summarize errors
        if: failure()
        run: |
          {
            grep -n -E "error:|What went wrong|Could not|FAILED|not found|cannot find symbol" -A4 build.log | head -n 200
          } > summary.txt || true
          msg=$(python3 -c "import sys,urllib.parse;print(open('summary.txt').read()[:30000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=Gradle build failed::$msg"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stormforge-jar
          path: build/libs/*.jar
