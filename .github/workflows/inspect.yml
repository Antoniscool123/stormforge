name: inspect

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Resolve jars
        run: gradle build --no-daemon --console=plain > /dev/null 2>&1 || true
      - name: Dump
        run: |
          set +e
          mkdir -p out
          MCJ=~/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          FJARS=$(find ~/.gradle/caches/modules-2 -path "*net.fabricmc.fabric-api*" -name "*.jar" ! -name "*sources*" | tr '\n' ':')
          CP="$MCJ:$FJARS"
          q() { echo "## $1 / $2" >> out/api.txt; javap -cp "$CP" -protected "$1" 2>&1 | grep -E "$2" | cut -c1-400 >> out/api.txt; }
          q net.minecraft.world.level.block.StairBlock "StairBlock|class"
          q net.minecraft.world.level.block.TransparentBlock "TransparentBlock|class"
          q net.minecraft.world.level.block.HalfTransparentBlock "HalfTransparentBlock|class"
          q net.minecraft.world.level.block.TintedGlassBlock "TintedGlassBlock|class"
          q net.minecraft.world.level.block.SlabBlock "SlabBlock\("
          q net.minecraft.world.level.block.WallBlock "WallBlock\("
          q net.minecraft.world.effect.MobEffect "MobEffect\(|class"
          q net.minecraft.core.Registry "registerForHolder|static.*register\("
          q net.minecraft.world.item.ItemUseAnimation "EAT|DRINK|class"
          q net.minecraft.sounds.SoundEvents "GENERIC_EAT|GENERIC_DRINK|HONEY_DRINK"
          q net.minecraft.world.item.consume_effects.ConsumeEffect "class|interface"
          q net.minecraft.server.MinecraftServer "getTickCount|getPlayerList"
          q net.minecraft.server.players.PlayerList "getPlayers"
          q net.minecraft.world.level.levelgen.GenerationStep\$Decoration "UNDERGROUND"
          q net.minecraft.world.level.block.state.BlockBehaviour\$StatePredicate "."
          q net.minecraft.world.level.block.state.BlockBehaviour\$StateArgumentPredicate "."
          q net.minecraft.world.item.ItemStack "is\(net.minecraft.world.item.Item\)"
          q net.minecraft.world.level.block.SoundType "GLASS|LANTERN|METAL"
          q net.minecraft.world.item.CreativeModeTab\$DisplayItemsGenerator "."
          q net.minecraft.world.item.CreativeModeTab\$Row "TOP|BOTTOM"
          q net.minecraft.world.entity.LivingEntity "getBoundingBox|isAlive"
          q net.minecraft.world.entity.Entity "getBoundingBox"
      - name: Publish dump to scratch branch
        run: |
          git config user.name "inspect-bot"
          git config user.email "inspect-bot@users.noreply.github.com"
          git checkout --orphan inspect-out
          git rm -rf --cached . > /dev/null 2>&1
          find . -mindepth 1 -maxdepth 1 ! -name out ! -name .git -exec rm -rf {} +
          git add out
          git commit -q -m "inspection dump"
          git push -f origin inspect-out
