name: inspect

on:
  push:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: Resolve jars
        run: gradle build --no-daemon --console=plain > /dev/null 2>&1 || true
      - name: Dump
        run: |
          set +e
          emit() {
            msg=$(python3 -c "import sys;print(open(sys.argv[1]).read()[:30000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))" "$2")
            echo "::notice title=$1::$msg"
          }
          MCJ=~/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          BIOME=$(find ~/.gradle/caches/modules-2 -name "fabric-biome-api-v1*.jar" ! -name "*sources*" | head -1)
          CP="$MCJ:$BIOME"
          mkdir -p v && cd v && unzip -q -o $MCJ 'data/minecraft/loot_table/blocks/diamond_ore.json' 'data/minecraft/loot_table/blocks/iron_block.json' 'data/minecraft/worldgen/configured_feature/ore_diamond_small.json' 'data/minecraft/worldgen/placed_feature/ore_diamond.json' 'data/minecraft/worldgen/placed_feature/ore_gold.json' 'data/minecraft/recipe/iron_block.json' 'data/minecraft/recipe/iron_ingot_from_iron_block.json' 'data/minecraft/recipe/diamond_sword.json' 'data/minecraft/tags/block/needs_iron_tool.json' 'assets/minecraft/items/diamond_ore.json' 'assets/minecraft/blockstates/diamond_ore.json' 'assets/minecraft/models/block/cube_all.json' 'data/minecraft/worldgen/configured_feature/ore_gold.json'; cd ..
          : > j.txt
          for f in $(find v -type f -name "*.json" | sort); do echo "### $f" >> j.txt; cat $f | tr -d ' \n' >> j.txt; echo >> j.txt; done
          emit J j.txt
          : > s.txt
          q() { echo "## $1 $2" >> s.txt; javap -cp "$CP" -public "$1" 2>&1 | grep -E "$2" >> s.txt; }
          q net.minecraft.world.item.Item "hurtEnemy|postHurtEnemy|use\("
          q 'net.minecraft.world.item.Item$Properties' "sword|useBlockDescriptionPrefix|setId"
          q net.minecraft.world.item.ToolMaterial "ToolMaterial\(|NETHERITE|DIAMOND"
          q net.minecraft.world.entity.LivingEntity "hurtServer|isAlliedTo|distanceToSqr"
          q net.minecraft.world.entity.Entity "isAlliedTo|distanceToSqr"
          q net.minecraft.world.damagesource.DamageSources "lightningBolt"
          q net.minecraft.world.level.block.DropExperienceBlock "DropExperienceBlock\("
          q 'net.minecraft.world.level.block.state.BlockBehaviour$Properties' "lightLevel|requiresCorrectToolForDrops|strength|sound|setId| of\("
          q net.minecraft.world.level.block.SoundType "STONE|AMETHYST"
          q net.minecraft.world.item.BlockItem "BlockItem\("
          q net.minecraft.tags.BlockTags "INCORRECT_FOR_DIAMOND_TOOL"
          q net.minecraft.world.item.CreativeModeTabs "COMBAT|NATURAL_BLOCKS|BUILDING_BLOCKS|INGREDIENTS|TOOLS_AND_UTILITIES"
          q net.minecraft.world.level.levelgen.GenerationStep\$Decoration "UNDERGROUND_ORES"
          q net.minecraft.core.registries.Registries "PLACED_FEATURE|BLOCK;|ITEM;"
          q net.minecraft.sounds.SoundEvents "LIGHTNING_BOLT_IMPACT"
          q net.minecraft.util.valueproviders.UniformInt " of\("
          unzip -l $BIOME | grep -E "BiomeModifications|BiomeSelectors" | awk '{print $4}' >> s.txt
          javap -cp "$CP" -public net.fabricmc.fabric.api.biome.v1.BiomeModifications 2>&1 | grep -E "addFeature" >> s.txt
          javap -cp "$CP" -public net.fabricmc.fabric.api.biome.v1.BiomeSelectors 2>&1 | grep -E "foundInOverworld" >> s.txt
          emit S s.txt
